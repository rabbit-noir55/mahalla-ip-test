name: ip-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check token from GitHub IP
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            https://api.online-mahalla.uz/auth/user_info)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "TOKEN WORKS FROM GITHUB IP"
          else
            echo "TOKEN REJECTED"
            head -c 300 /tmp/out.json
          fi
